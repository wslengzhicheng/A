<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多股票对比 - A股分析</title>
<style>
:root { --bg:#0f1923; --card:#1a2634; --border:#2a3a4a; --text:#e0e6ed; --text2:#8899aa; --red:#f5475b; --green:#2ec47c; --blue:#3b82f6; --gold:#f0b90b; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.header { background:var(--card); border-bottom:1px solid var(--border); padding:16px 24px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:100; }
.header h1 { font-size:18px; white-space:nowrap; color:var(--gold); }
.nav { display:flex; gap:8px; margin-right:12px; }
.nav a { padding:6px 16px; border-radius:6px; font-size:14px; color:var(--text2); text-decoration:none; border:1px solid var(--border); transition:all .2s; }
.nav a:hover, .nav a.active { color:#fff; border-color:var(--blue); background:var(--blue); }
.container { max-width:1400px; margin:0 auto; padding:20px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:18px 22px; margin-bottom:16px; }
.card-title { font-size:15px; font-weight:600; margin-bottom:12px; color:var(--gold); }
.input-group { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.input-group input { flex:1; min-width:300px; padding:10px 14px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:14px; }
.input-group select { padding:10px 12px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); cursor:pointer; }
.btn { padding:10px 20px; border:none; border-radius:6px; font-size:14px; cursor:pointer; transition:all .2s; font-weight:500; }
.btn-primary { background:var(--blue); color:#fff; }
.btn-primary:hover { background:#2563eb; }
.btn-outline { background:transparent; color:var(--text2); border:1px solid var(--border); }
.btn-outline:hover { border-color:var(--text); color:var(--text); }
.quick-btns { display:flex; gap:8px; flex-wrap:wrap; }
.loading { display:none; text-align:center; padding:40px; }
.loading.active { display:block; }
.spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 12px; }
@keyframes spin { to { transform:rotate(360deg); } }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:right; padding:10px 12px; color:var(--text2); font-weight:500; border-bottom:2px solid var(--border); position:sticky; top:0; background:var(--card); cursor:pointer; user-select:none; }
th:first-child, th:nth-child(2) { text-align:left; }
th:hover { background:#1e2e3e; }
td { text-align:right; padding:8px 12px; border-bottom:1px solid #1e2e3e; }
td:first-child { text-align:left; color:var(--text2); width:40px; }
td:nth-child(2) { text-align:left; font-weight:500; cursor:pointer; }
td:nth-child(2):hover { color:var(--blue); }
.up { color:var(--red); }
.down { color:var(--green); }
.score-high { color:var(--red); font-weight:700; }
.score-mid { color:var(--gold); font-weight:700; }
.score-low { color:var(--green); font-weight:700; }
.summary-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.summary-card { padding:16px; background:var(--bg); border-radius:8px; text-align:center; }
.summary-card .label { font-size:12px; color:var(--text2); margin-bottom:4px; }
.summary-card .value { font-size:22px; font-weight:700; }
.chart-container { position:relative; width:100%; height:300px; margin-top:16px; }
.chart-container canvas { width:100%; height:100%; }
.error-box { display:none; background:#2d1b1b; border:1px solid #5c2020; border-radius:8px; padding:16px 20px; margin:20px 0; color:var(--red); }
.error-box.active { display:block; }
</style>
</head>
<body>

<div class="header">
  <h1>📊 多股票对比</h1>
          <div class="nav">
    <a href="/">个股分析</a>
    <a href="/compare.html" class="active">选股对比</a>
    <a href="/backtest.html">回测验证</a>
    <a href="/paper.html">模拟盘</a>
    <a href="/watchlist.html">我的盯盘</a>
    <a href="/market_overview.html">市场概览</a>
    <a href="/market.html">板块排行</a>
    <a href="/stock_picker.html">机会扫描</a>
    <a href="/s2.html">仓位分析</a>
  </div>
</div>

<div class="container">
  <!-- Input -->
  <div class="card">
    <div class="card-title">股票代码（逗号分隔，最多20只）</div>
    <div class="input-group">
      <input type="text" id="codesInput" placeholder="600519,000001,300750,601318,600036" value="600519,000001,300750">
      <select id="daysSelect">
        <option value="60">60日</option>
        <option value="120">120日</option>
        <option value="250" selected>250日</option>
        <option value="320">320日</option>
      </select>
      <label style="display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text2)">
        <input type="checkbox" id="freshCheck"> 刷新
      </label>
      <button class="btn btn-primary" id="compareBtn" onclick="doCompare()">对比分析</button>
    </div>
    <div class="quick-btns">
      <button class="btn btn-outline" onclick="setCodes('600519,000001,300750,601318,600036')">热门白马股</button>
      <button class="btn btn-outline" onclick="setCodes('600036,000001,601318,601166,000858')">银行股</button>
      <button class="btn btn-outline" onclick="setCodes('600519,000858,002594,603288,000568')">白酒股</button>
      <button class="btn btn-outline" onclick="setCodes('300750,002415,300014,688981,688111')">科技股</button>
    </div>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorSection"></div>

  <!-- Loading -->
  <div class="loading" id="loadingSection">
    <div class="spinner"></div>
    <p>正在分析，请稍候...</p>
  </div>

  <!-- Results -->
  <div id="resultsSection" style="display:none">
    <!-- Summary -->
    <div class="card">
      <div class="card-title">📈 对比汇总</div>
      <div class="summary-cards" id="summaryCards"></div>
    </div>

    <!-- Chart -->
    <div class="card">
      <div class="card-title">📊 评分对比图</div>
      <div class="chart-container">
        <canvas id="scoreChart"></canvas>
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="card-title">📋 详细对比表（点击表头排序，点击股票查看详情）</div>
      <div style="overflow-x:auto">
        <table id="compareTable"></table>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function setCodes(codes) {
  $('codesInput').value = codes;
}

function fmt(v, suffix='', nd=2) {
  if(v == null) return '—';
  return Number(v).toFixed(nd) + suffix;
}

function cls(v) { return v > 0 ? 'up' : v < 0 ? 'down' : ''; }
function pct(v) { return v != null ? (v > 0 ? '+' : '') + v.toFixed(2) + '%' : '—'; }
function scoreCls(score) {
  if(score == null) return '';
  if(score >= 60) return 'score-high';
  if(score >= 40) return 'score-mid';
  return 'score-low';
}

let currentSort = { field: 'score', desc: true };

async function doCompare() {
  const codes = $('codesInput').value.trim();
  if(!codes) {
    showError('请输入股票代码');
    return;
  }
  const days = $('daysSelect').value;
  const fresh = $('freshCheck').checked ? '1' : '0';

  $('loadingSection').classList.add('active');
  $('errorSection').classList.remove('active');
  $('resultsSection').style.display = 'none';
  $('compareBtn').disabled = true;

  try {
    const resp = await fetch(`/api/compare?codes=${encodeURIComponent(codes)}&days=${days}&fresh=${fresh}`);
    const data = await resp.json();
    if(!resp.ok) {
      showError(data.error || '对比失败');
      return;
    }
    renderResults(data);
    $('resultsSection').style.display = '';
  } catch(e) {
    showError('请求失败: ' + e.message);
  } finally {
    $('loadingSection').classList.remove('active');
    $('compareBtn').disabled = false;
  }
}

function showError(msg) {
  $('errorSection').textContent = '❌ ' + msg;
  $('errorSection').classList.add('active');
}

function renderResults(data) {
  const results = data.results || [];
  const summary = data.summary || {};

  // Summary cards
  $('summaryCards').innerHTML = `
    <div class="summary-card">
      <div class="label">成功分析</div>
      <div class="value">${summary.success}/${summary.total}</div>
    </div>
    <div class="summary-card">
      <div class="label">平均评分</div>
      <div class="value" style="color:${summary.avg_score >= 60 ? 'var(--red)' : summary.avg_score >= 40 ? 'var(--gold)' : 'var(--green)'}">
        ${fmt(summary.avg_score)}
      </div>
    </div>
    <div class="summary-card">
      <div class="label">平均涨跌</div>
      <div class="value ${cls(summary.avg_change)}">${pct(summary.avg_change)}</div>
    </div>
    <div class="summary-card">
      <div class="label">市场共识</div>
      <div class="value" style="font-size:16px">${summary.consensus || '—'}</div>
    </div>
    <div class="summary-card">
      <div class="label">最强股票</div>
      <div class="value" style="font-size:14px">
        ${summary.strongest ? `${summary.strongest.name} (${fmt(summary.strongest.score)})` : '—'}
      </div>
    </div>
  `;

  // Chart
  if(data.matrix) {
    setTimeout(() => drawScoreChart(data.matrix), 50);
  }

  // Table
  const validResults = results.filter(r => r.success);
  if(!validResults.length) {
    $('compareTable').innerHTML = '<tr><td colspan="12" style="padding:20px;text-align:center">无有效数据</td></tr>';
    return;
  }

  sortResults(validResults, currentSort.field, currentSort.desc);

  const cols = [
    { key: '', label: '#' },
    { key: 'name', label: '股票名称' },
    { key: 'price', label: '现价' },
    { key: 'change_pct', label: '涨跌幅' },
    { key: 'score', label: '评分' },
    { key: 'grade', label: '等级' },
    { key: 'prediction', label: '预测' },
    { key: 'pe_ttm', label: 'PE' },
    { key: 'pb', label: 'PB' },
    { key: 'mktcap_total', label: '市值(亿)' },
    { key: 'volatility', label: '波动率%' },
    { key: 'turnover', label: '换手率%' },
  ];

  let html = '<thead><tr>';
  cols.forEach((c, i) => {
    html += `<th onclick="sortBy('${c.key}')">${c.label}`;
    if(currentSort.field === c.key) {
      html += currentSort.desc ? ' ↓' : ' ↑';
    }
    html += '</th>';
  });
  html += '</tr></thead><tbody>';

  validResults.forEach((r, i) => {
    html += `<tr>
      <td>${i+1}</td>
      <td onclick="goToDetail('${r.code}')" style="cursor:pointer">${r.name} (${r.code})</td>
      <td>${fmt(r.price)}</td>
      <td class="${cls(r.change_pct)}">${pct(r.change_pct)}</td>
      <td class="${scoreCls(r.score)}">${fmt(r.score)}</td>
      <td>${r.grade || '—'}</td>
      <td>${r.prediction || '—'}</td>
      <td>${fmt(r.pe_ttm)}</td>
      <td>${fmt(r.pb)}</td>
      <td>${fmt(r.mktcap_total, '', 0)}</td>
      <td>${fmt(r.volatility)}</td>
      <td>${fmt(r.turnover)}</td>
    </tr>`;
  });
  html += '</tbody>';
  $('compareTable').innerHTML = html;
}

function sortResults(results, field, desc) {
  results.sort((a, b) => {
    let va = a[field], vb = b[field];
    if(field === 'name') {
      va = va.toLowerCase(); vb = vb.toLowerCase();
      return desc ? vb.localeCompare(va) : va.localeCompare(vb);
    }
    if(va == null) return 1;
    if(vb == null) return -1;
    return desc ? vb - va : va - vb;
  });
}

function sortBy(field) {
  if(currentSort.field === field) {
    currentSort.desc = !currentSort.desc;
  } else {
    currentSort.field = field;
    currentSort.desc = true;
  }
  doCompare();
}

function goToDetail(code) {
  window.location.href = `/?q=${code}`;
}

function drawScoreChart(matrix) {
  const canvas = $('scoreChart');
  const container = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const W = container.clientWidth, H = container.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const names = matrix.names || [];
  const scores = matrix.scores || [];
  if(!names.length) return;

  const barH = H / names.length - 10;
  const barY = 10;
  const maxScore = 100;
  const padL = 50, padR = 80;

  names.forEach((name, i) => {
    const score = scores[i] || 0;
    const barW = (score / maxScore) * (W - padL - padR);
    const y = barY + i * (barH + 10);
    const color = score >= 60 ? 'var(--red)' : score >= 40 ? 'var(--gold)' : 'var(--green)';

    ctx.fillStyle = color;
    ctx.fillRect(padL, y, Math.max(barW, 0), barH);

    ctx.fillStyle = '#6b7d8e';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(name.slice(0, 8), padL - 8, y + barH/2 + 4);

    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.fillText(score.toFixed(1), padL + barW + 8, y + barH/2 + 4);
  });
}

window.addEventListener('resize', () => {
  if(window._lastMatrix) drawScoreChart(window._lastMatrix);
});

const _origRender = renderResults;
renderResults = function(data) {
  window._lastMatrix = data.matrix;
  _origRender(data);
};

// Enter key to submit
$('codesInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') doCompare();
});
</script>
</body>
</html>
